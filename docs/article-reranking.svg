<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620" role="img" aria-labelledby="title desc">
  <title id="title">Что изменил реранкер</title>
  <desc id="desc">После BGE Hit@10 вырос с 229 до 230 из 240, а nDCG@10 — с 0,832 до 0,883.</desc>

  <rect width="1560" height="620" rx="26" fill="#f6f0e4"/>

  <text x="70" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#171411">Что изменил реранкер</text>
  <text x="70" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#71695f">Hybrid до и после BGE · 240 вопросов</text>
  <path d="M70 141 C250 134 430 147 610 139" fill="none" stroke="#c92d22" stroke-width="6" stroke-linecap="round"/>

  <path d="M520 190 C515 272 525 385 519 480" fill="none" stroke="#d9d0c2" stroke-width="4" stroke-linecap="round"/>

  <text x="70" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#27221d">Попаданий в top-10</text>
  <text x="70" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#8a8176">Hit@10</text>
  <text x="70" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#6d6861">229</text>
  <text x="172" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" fill="#aaa196">→</text>
  <text x="235" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#6d6861">230</text>
  <text x="337" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#8a8176">из 240</text>
  <text x="70" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#71695f">Ещё один ответ</text>

  <text x="610" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#b9251b">Нужные фрагменты поднялись выше</text>
  <text x="610" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#8a8176">nDCG@10</text>
  <text x="610" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#8a8176">до BGE</text>
  <text x="950" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#8a8176">после BGE</text>
  <text x="610" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="72" font-weight="700" fill="#6d6861">83,2%</text>
  <text x="862" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" fill="#aaa196">→</text>
  <text x="950" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="72" font-weight="700" fill="#c92d22">88,3%</text>
  <text x="610" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#27221d">В среднем ближе к началу выдачи</text>

  <image href="telegram-plane.png" x="73" y="555" width="29" height="27"/>
  <text x="110" y="578" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#171411">@devbrombin</text>
