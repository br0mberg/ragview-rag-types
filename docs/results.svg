<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Результаты retrieval и reranking</title>
  <desc id="desc">Dense, BM25 и hybrid по Hit@10, а также hybrid до и после BGE по Hit@10 и nDCG@10.</desc>
  <rect width="1200" height="520" rx="28" fill="#f7f5ef"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#181818">Что изменили hybrid и BGE</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#666">240 вопросов по НК РФ, top-10</text>

  <text x="60" y="152" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#181818">Первый этап: Hit@10</text>
  <line x1="185" y1="200" x2="535" y2="200" stroke="#cbc7bc" stroke-width="2"/>
  <line x1="185" y1="190" x2="185" y2="210" stroke="#8f8a80" stroke-width="2"/>
  <line x1="360" y1="190" x2="360" y2="210" stroke="#8f8a80" stroke-width="2"/>
  <line x1="535" y1="190" x2="535" y2="210" stroke="#8f8a80" stroke-width="2"/>
  <text x="176" y="232" font-family="Arial, sans-serif" font-size="14" fill="#777">80</text>
  <text x="351" y="232" font-family="Arial, sans-serif" font-size="14" fill="#777">90</text>
  <text x="520" y="232" font-family="Arial, sans-serif" font-size="14" fill="#777">100%</text>

  <text x="60" y="280" font-family="Arial, sans-serif" font-size="17" fill="#333">dense</text>
  <line x1="185" y1="274" x2="339" y2="274" stroke="#a7a299" stroke-width="8" stroke-linecap="round"/>
  <circle cx="339" cy="274" r="9" fill="#77726a"/>
  <text x="355" y="280" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#333">88,8%</text>

  <text x="60" y="340" font-family="Arial, sans-serif" font-size="17" fill="#333">BM25</text>
  <line x1="185" y1="334" x2="418" y2="334" stroke="#dd9c55" stroke-width="8" stroke-linecap="round"/>
  <circle cx="418" cy="334" r="9" fill="#d78637"/>
  <text x="434" y="340" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#333">93,3%</text>

  <text x="60" y="400" font-family="Arial, sans-serif" font-size="17" fill="#333">hybrid</text>
  <line x1="185" y1="394" x2="455" y2="394" stroke="#5d93b6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="455" cy="394" r="9" fill="#397fa8"/>
  <text x="471" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#333">95,4%</text>

  <line x1="600" y1="145" x2="600" y2="455" stroke="#ddd9ce" stroke-width="2"/>
  <text x="650" y="152" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#181818">Hybrid до и после BGE</text>

  <text x="650" y="224" font-family="Arial, sans-serif" font-size="17" fill="#333">Hit@10</text>
  <rect x="770" y="201" width="286" height="28" rx="14" fill="#397fa8"/>
  <text x="1072" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#181818">95,4%</text>
  <rect x="770" y="241" width="287" height="28" rx="14" fill="#d78637"/>
  <text x="1072" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#181818">95,8%</text>

  <text x="650" y="340" font-family="Arial, sans-serif" font-size="17" fill="#333">nDCG@10</text>
  <rect x="770" y="317" width="250" height="28" rx="14" fill="#397fa8"/>
  <text x="1036" y="338" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#181818">83,2%</text>
  <rect x="770" y="357" width="265" height="28" rx="14" fill="#d78637"/>
  <text x="1051" y="378" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#181818">88,3%</text>

  <circle cx="653" cy="430" r="7" fill="#397fa8"/>
  <text x="670" y="436" font-family="Arial, sans-serif" font-size="15" fill="#555">до BGE</text>
  <circle cx="770" cy="430" r="7" fill="#d78637"/>
  <text x="787" y="436" font-family="Arial, sans-serif" font-size="15" fill="#555">после BGE</text>
</svg>
