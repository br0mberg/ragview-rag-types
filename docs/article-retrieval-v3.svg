<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620" role="img" aria-labelledby="title desc">
  <title id="title">Где hybrid помог</title>
  <desc id="desc">На 186 вопросах hybrid почти не изменил число промахов среди первых 10 чанков, но среди первых 50 сократил их до 4 против 10 у dense и 9 у BM25.</desc>

  <rect width="1560" height="620" rx="26" fill="#f6f0e4"/>

  <text x="70" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#171411">Где hybrid помог</text>
  <text x="70" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#71695f">Промахи по 186 вопросам с процитированной статьёй · меньше — лучше</text>
