name: Ошибка воспроизводимости
description: Результат или команда из README не воспроизводится
title: "[repro] "
labels:
  - reproducibility
body:
  - type: markdown
    attributes:
      value: Укажите достаточно данных, чтобы прогон можно было повторить.
  - type: textarea
    id: command
    attributes:
      label: Команда
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: ОС, Java, Python, GPU, модель и revision.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Артефакты
      description: Приложите RUN.json, manifest или небольшой фрагмент вывода без секретов.
